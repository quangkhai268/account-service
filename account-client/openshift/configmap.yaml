apiVersion: v1
kind: ConfigMap
metadata:
  name: account-client-config
data:
  # Spring Boot tự map biến môi trường sang property (relaxed binding)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-host:5432/account_client"
  # Cùng namespace: gọi qua Service name. Khác cluster: dùng URL của Route.
  ACCOUNT_API_URL: "http://account-server:8081/api/v1/accounts/getAccountList"
  ACCOUNT_API_APPCODE: "APP01"
  ACCOUNT_API_CONNECTTIMEOUT: "3s"
  ACCOUNT_API_READTIMEOUT: "10s"
